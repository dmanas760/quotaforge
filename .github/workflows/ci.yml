name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quotaforge_test
          POSTGRES_USER: quotaforge
          POSTGRES_PASSWORD: quotaforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout=120s
        env:
          DATABASE_URL: postgres://quotaforge:quotaforge@localhost:5432/quotaforge_test?sslmode=disable
          REDIS_ADDR: localhost:6379

      - name: Test with race detector
        run: go test -race ./... -count=1 -timeout=180s
        env:
          DATABASE_URL: postgres://quotaforge:quotaforge@localhost:5432/quotaforge_test?sslmode=disable
          REDIS_ADDR: localhost:6379

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
